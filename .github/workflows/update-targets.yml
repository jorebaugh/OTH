name: Update targets
# Reads the Golf Bunch targets sheet every 30 minutes from 0400 to 0700 Central (0407, 0437 ... 0707).
# GitHub schedules run in UTC, so there are lines for summer time (CDT) and winter time (CST);
# the first step skips whichever lines don't match today's clock.
on:
  schedule:
    - cron: "7,37 9-11 * * *"    # CDT 0407-0637
    - cron: "7 12 * * *"         # CDT 0707
    - cron: "7,37 10-12 * * *"   # CST 0407-0637
    - cron: "7 13 * * *"         # CST 0707
  workflow_dispatch: {}     # "Run workflow" button for an on-demand refresh
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check Central time slot
        id: slot
        run: |
          ZONE=$(TZ=America/Chicago date +%Z)
          S="${{ github.event.schedule }}"
          RUN=yes
          if [ -n "$S" ]; then
            case "$ZONE:$S" in
              "CDT:7,37 9-11 * * *"|"CDT:7 12 * * *"|"CST:7,37 10-12 * * *"|"CST:7 13 * * *") RUN=yes ;;
              *) RUN=no ;;
            esac
          fi
          echo "Central zone $ZONE, schedule '$S', run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - if: steps.slot.outputs.run == 'yes'
        uses: actions/checkout@v4
      - if: steps.slot.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.slot.outputs.run == 'yes'
        id: read
        continue-on-error: true
        run: python scripts/update_targets.py
      - if: steps.slot.outputs.run == 'yes'
        name: Commit if changed
        run: |
          git config user.name "targets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add targets.json targets-status.txt
          git diff --cached --quiet || (git commit -m "Update targets" && git pull --rebase -q && git push)
      - if: steps.read.outcome == 'failure'
        run: |
          cat targets-status.txt
          exit 1
