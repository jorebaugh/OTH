name: Update targets
# Reads the Golf Bunch targets at 0700 and 1800 Central.
# GitHub schedules run in UTC, so both summer (CDT) and winter (CST) times are listed
# and the check step skips whichever pair doesn't match today's clock.
on:
  schedule:
    - cron: "0 12 * * *"   # 0700 CDT
    - cron: "0 23 * * *"   # 1800 CDT
    - cron: "0 13 * * *"   # 0700 CST
    - cron: "0 0 * * *"    # 1800 CST
  workflow_dispatch: {}     # "Run workflow" button for an on-demand refresh
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check Central time slot
        id: slot
        run: |
          ZONE=$(TZ=America/Chicago date +%Z)
          S="${{ github.event.schedule }}"
          RUN=yes
          if [ -n "$S" ]; then
            case "$ZONE:$S" in
              "CDT:0 12 * * *"|"CDT:0 23 * * *"|"CST:0 13 * * *"|"CST:0 0 * * *") RUN=yes ;;
              *) RUN=no ;;
            esac
          fi
          echo "Central zone $ZONE, schedule '$S', run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - if: steps.slot.outputs.run == 'yes'
        uses: actions/checkout@v4
      - if: steps.slot.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.slot.outputs.run == 'yes'
        run: python scripts/update_targets.py
      - if: steps.slot.outputs.run == 'yes'
        name: Commit if changed
        run: |
          git config user.name "targets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add targets.json
          git diff --cached --quiet || (git commit -m "Update targets" && git push)
