name: Update targets
# Reads the Golf Bunch targets sheet at 0000, 0500, 0600 and 0700 Central.
# GitHub schedules run in UTC, so there is one line for summer time (CDT) and one for winter (CST);
# the first step skips whichever line doesn't match today's clock.
on:
  schedule:
    - cron: "23 5,10,11,12 * * *"   # CDT: 0023, 0523, 0623, 0723
    - cron: "23 6,11,12,13 * * *"   # CST: 0023, 0523, 0623, 0723
  workflow_dispatch: {}     # "Run workflow" button for an on-demand refresh
permissions:
  contents: write
concurrency:
  group: targets
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check Central time slot
        id: slot
        run: |
          ZONE=$(TZ=America/Chicago date +%Z)
          S="${{ github.event.schedule }}"
          RUN=yes
          if [ -n "$S" ]; then
            case "$ZONE:$S" in
              "CDT:23 5,10,11,12 * * *"|"CST:23 6,11,12,13 * * *") RUN=yes ;;
              *) RUN=no ;;
            esac
          fi
          echo "Central zone $ZONE, schedule '$S', run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
      - if: steps.slot.outputs.run == 'yes'
        uses: actions/checkout@v4
      - if: steps.slot.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.slot.outputs.run == 'yes'
        id: read
        continue-on-error: true
        run: python scripts/update_targets.py
      - if: steps.slot.outputs.run == 'yes'
        name: Commit if changed
        run: |
          git config user.name "targets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add targets.json targets-status.txt
          git diff --cached --quiet || (git commit -m "Update targets" && git pull --rebase -q && git push)
      - if: steps.read.outcome == 'failure'
        run: |
          cat targets-status.txt
          exit 1
