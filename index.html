<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OTH Golf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Windyke Points Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a scorecard held in a cart — hole header, player rows with big tap targets, sticky nav at the thumb */
:root{
  --bg:#eef2ee; --card:#ffffff; --ink:#14251c; --muted:#5d6e64; --line:#d5ded7;
  --pine:#1d5a3a; --pine-ink:#ffffff; --flag:#c8322b; --sand:#e9e1cc; --chip:#e3eae4;
  --good:#1f7a45; --bad:#b3362f;
  --p1:#d9661f; --p2:#2f7fc1; --p3:#8a4fb8; --p4:#b8921a; --p5:#c23f78;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --card:#17221d; --ink:#e6eee9; --muted:#93a59b; --line:#2a3a32;
  --pine:#3f9a68; --pine-ink:#07140d; --flag:#ef6158; --sand:#2e2a20; --chip:#22302a;
  --good:#5cc68a; --bad:#f07a72;
  --p1:#f08a45; --p2:#5ea8e6; --p3:#b384de; --p4:#e0bd45; --p5:#e870a6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --card:#17221d; --ink:#e6eee9; --muted:#93a59b; --line:#2a3a32;
  --pine:#3f9a68; --pine-ink:#07140d; --flag:#ef6158; --sand:#2e2a20; --chip:#22302a;
  --good:#5cc68a; --bad:#f07a72;
  --p1:#f08a45; --p2:#5ea8e6; --p3:#b384de; --p4:#e0bd45; --p5:#e870a6; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{padding:14px 18px;border-radius:12px;font-weight:700;background:var(--chip);text-align:center}
.btn.primary{background:var(--pine);color:var(--pine-ink)}
.btn.danger{background:var(--flag);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:8px 12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}

/* Brand bar */
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{font-size:30px;font-weight:700;display:flex;align-items:center;gap:8px}
.flagmark{width:16px;height:26px;flex:none}
.iconbtn{padding:8px 10px;border-radius:10px;background:var(--chip);font-size:13px;font-weight:600}

/* Setup */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:12px 6px;border-radius:10px;background:var(--chip);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-weight:500;color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--pine);color:var(--pine-ink)}
.seg button[aria-pressed="true"] small{color:var(--pine-ink);opacity:.8}
.course-seg{grid-template-columns:1fr 1fr}
.prow{display:grid;grid-template-columns:10px 1fr 84px 40px;gap:8px;align-items:center}
.swatch{width:10px;height:36px;border-radius:4px}
.xbtn{height:44px;border-radius:10px;background:var(--chip);font-weight:700;color:var(--muted)}
.roster{display:flex;flex-wrap:wrap;gap:6px}
.roster button{padding:6px 10px;border-radius:999px;background:var(--chip);font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px;font-weight:600}

/* Hole header */
.hole{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hole .big{font-family:var(--display);font-size:64px;line-height:.9;font-weight:700}
.hole .big span{font-size:24px;color:var(--muted);font-weight:600}
.facts{display:flex;gap:16px;margin-top:6px}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--display);font-size:26px;line-height:1}
.green{width:92px;height:104px}
.dots{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.dots button{height:40px;border-radius:8px;background:var(--chip);font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted);padding:0}
.dots button.done{background:color-mix(in srgb,var(--pine) 35%,var(--chip));color:var(--ink)}
.dots button.cur{background:var(--pine);color:var(--pine-ink)}
.dots .gap{grid-column:span 1}

.holenav{display:flex;align-items:center;gap:10px}
.arrow{width:48px;height:48px;border-radius:12px;background:var(--chip);font-size:20px;flex:none}
.arrow:disabled{opacity:.3;cursor:not-allowed}
/* Player scoring rows */
.player{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.player:first-of-type{border-top:0;padding-top:0}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pname{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;min-width:0}
.pname i{width:10px;height:10px;border-radius:50%;flex:none}
.pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstat{font-size:14px;color:var(--muted);white-space:nowrap}
.pstat b{color:var(--ink)}
.pts{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pts button{background:var(--chip);border-radius:10px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:0;min-height:58px}
.pts button b{font-family:var(--display);font-size:28px;line-height:1}
.pts button small{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.pts button[aria-pressed="true"]{background:var(--pc);color:#fff}
.pts button[aria-pressed="true"] small{color:#fff;opacity:.85}
.delta{font-weight:700}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}

/* Team strip */
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.team div{display:flex;flex-direction:column;gap:2px}
.team b{font-family:var(--display);font-size:30px;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--pine);border-radius:99px}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--flag)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:auto auto 1fr;gap:8px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--chip);padding:4px;border-radius:12px}
.tabs button{padding:8px;border-radius:9px;font-weight:600;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* Player finder */
.finder{display:flex;flex-direction:column;gap:6px}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.results button{display:flex;justify-content:space-between;gap:10px;padding:12px;border-top:1px solid var(--line);text-align:left;background:var(--card)}
.results button:first-child{border-top:0}
.results button b{font-family:var(--display);font-size:20px;color:var(--pine)}
.results .hint{padding:12px}
/* Live standings */
.stand{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;margin-block:-6px}
.chipcard{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;min-width:0}
.chipcard .cn{display:flex;align-items:center;gap:6px;width:100%;font-weight:700;font-size:14px;min-width:0}
.chipcard .cn i{display:none}
.chipcard .cn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.chipcard .cn em{font-style:normal;font-size:11px;color:var(--muted);font-weight:700}
.chipcard .cl{display:flex;align-items:baseline;gap:4px;width:100%}
.chipcard .cl .label{flex:1;font-size:11px}
.chipcard .cl b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05}
.chipcard .cl .of{font-size:13px;color:var(--muted);font-weight:600}
.chipcard .cl.dim{opacity:.6}
.chipcard .cl.tot18{border-top:1px solid var(--line);margin-top:2px;padding-top:2px}
.chipcard .cl b{font-size:22px}
table.card small.of{color:var(--muted);font-weight:500;font-size:11px}
.etgrid{display:grid;grid-template-columns:1fr 84px 44px 44px;gap:8px;align-items:center}
.etgrid b{font-family:var(--display);font-size:22px;text-align:center}
.etgrid input{padding:10px}
/* Player correction sheet */
.pgrid{display:flex;flex-direction:column;gap:4px}
.pgrid>div{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.pgrid button{background:var(--chip);border-radius:8px;padding:4px 0;display:flex;flex-direction:column;align-items:center}
.pgrid button small{font-size:10px;color:var(--muted)}
.pgrid button b{font-family:var(--display);font-size:20px;line-height:1.1}
.pgrid button.empty b{color:var(--muted)}
.pgrid button.sel{outline:3px solid var(--pine);background:var(--card)}
/* Scorecard grid */
.gridwrap{overflow-x:auto;margin-inline:-16px;padding-inline:16px}
table.card{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;min-width:100%}
table.card th,table.card td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);min-width:30px}
table.card th:first-child,table.card td:first-child{text-align:left;position:sticky;left:0;background:var(--card);min-width:84px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
table.card thead th{font-family:var(--display);font-size:16px}
table.card .sub td{color:var(--muted);font-size:12px}
table.card .tot{font-weight:700;background:color-mix(in srgb,var(--sand) 60%,var(--card))}
table.card td button{width:30px;height:30px;border-radius:7px;font-weight:700}
table.card td button.empty{color:var(--muted)}
table.card td button.gsel{background:var(--pc);color:#fff;outline:2px solid var(--ink);outline-offset:1px}
.gpad{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;box-shadow:0 -6px 20px rgb(0 0 0 / .12);border-color:var(--pc)}

/* Summaries */
.lb{display:flex;flex-direction:column;gap:0}
.lbrow{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.lbrow:first-child{border-top:0}
.rank{font-family:var(--display);font-size:22px;color:var(--muted)}
.lbrow .score{font-family:var(--display);font-size:28px;font-weight:700}
.lbrow .tgt{font-size:13px;color:var(--muted);text-align:right;min-width:74px}
.verdict{font-family:var(--display);font-size:40px;line-height:1;font-weight:700}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20}
@media (prefers-reduced-motion:no-preference){.pts button{transition:background .12s}.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<div class="wrap" id="app"></div>
<div id="layer"></div>

<script>
const COURSES=[
 {id:"WindykeWest",name:"West Course",club:"Windyke CC",holes:[[4,7,"BMF"],[4,1,"FBM"],[3,17,"MFB"],[5,13,"BMF"],[4,9,"FBM"],[4,11,"MFB"],[5,3,"BMF"],[3,5,"FBM"],[4,15,"MFB"],[5,4,"BMF"],[4,14,"FBM"],[4,2,"MFB"],[3,8,"BMF"],[5,16,"FBM"],[4,12,"MFB"],[4,6,"BMF"],[3,18,"FBM"],[4,10,"MFB"]]},
 {id:"WindykeEast",name:"East Course",club:"Windyke CC",holes:[[5,17,"BMF"],[4,7,"FBM"],[3,9,"MFB"],[4,11,"BMF"],[4,13,"FBM"],[5,1,"MFB"],[4,5,"BMF"],[3,15,"FBM"],[4,3,"MFB"],[5,16,"BMF"],[4,18,"FBM"],[3,12,"MFB"],[4,4,"BMF"],[4,6,"FBM"],[4,8,"MFB"],[3,14,"BMF"],[5,10,"FBM"],[4,2,"MFB"]]}
];
/* Golf Bunch targets — snapshot of gdwilder.linkpro.net/GolfBunchTargets.htm (Sep 30 2026). Live copy is fetched from ./targets when hosted. */
const TARGETS_SNAPSHOT={date:"Sep 30, 2026",list:[["Paul Allen",18],["Tom Ashe",14],["Glenn Bell",20],["Marc Brunelle",20],["Mike Boswell",16],["Rick Fuller",29],["Jim Hull",23],["Bora Kang",7],["James Kang",22],["Mark Kern",17],["Helen Kim",8],["Sam Kim",31],["Yuri Kim",15],["Mike Landreth",20],["Rick Moore",21],["Ted Morley",18],["Eddie Munson",27],["Jesse Orebaugh",13],["Buddy Ritchey",27],["Ed Schneider",15],["Van Smith",21],["Glen Stewart",27],["Charlie Swan",24],["Jim Tims",23],["Jonathan Tweel",19],["Lance Warren",22],["Mike Weerasinghe",15],["Dave Wells",29],["Larry Wiggins",21],["Charlie Wilder",21],["Gerry Wilder",19],["Ted Wilder",21],["Dan Work",15],["Ted Yeiser",27],["Young Oh Kim",null],["Jae Kim",null]]};
let TARGETS={source:"snapshot",date:TARGETS_SNAPSHOT.date,list:TARGETS_SNAPSHOT.list};
async function loadTargets(){
  try{
    const j=await fetch("targets.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()});
    if(!j.list||j.list.length<5)throw 0;
    TARGETS={source:"live",date:new Date(j.updated).toLocaleDateString(undefined,{month:"short",day:"numeric"}),list:j.list};
    store.set("windyke-targets",TARGETS);
    if(S.view==="setup")render();
    return;
  }catch(e){}
  try{
    const r=await fetch("targets",{cache:"no-store"}); if(!r.ok)throw 0;
    const doc=new DOMParser().parseFromString(await r.text(),"text/html");
    const list=[];
    doc.querySelectorAll("tr").forEach(tr=>{const c=[...tr.cells].map(td=>td.textContent.replace(/\s+/g," ").trim());
      if(c.length<3||!c[0].includes(","))return;
      const [last,first]=c[0].split(",").map(s=>s.trim()); const t=parseFloat(c[2]);
      list.push([`${first} ${last}`.trim(),isNaN(t)?null:t]);});
    if(list.length<5)throw 0;
    TARGETS={source:"live",date:new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"}),list};
    store.set("windyke-targets",TARGETS);
  }catch(e){const c=store.get("windyke-targets");if(c&&c.list)TARGETS={...c,source:"saved"}}
  if(S.view==="setup")render();
}
const findTarget=name=>{const n=name.trim().toLowerCase();return TARGETS.list.find(([m])=>m.toLowerCase()===n)};
let q="";
const LOC={F:"Front",M:"Middle",B:"Back"};
const PTS=[["0","Dbl+"],["1","Bogey"],["2","Par"],["3","Birdie"],["4","Eagle"],["5","Alb"]];
const COLORS=["--p1","--p2","--p3","--p4","--p5"];
const KEY="windyke-points-v2", RKEY="windyke-roster";
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const fresh=()=>({view:"setup",tab:"hole",courseId:"WindykeWest",pin:1,hole:0,turnSeen:false,
  players:[{name:"Jesse Orebaugh",target:"13"}].map(p=>({...p,scores:Array(18).fill(null)}))});
let S=store.get(KEY)||fresh();
let setupErr="", confirmReset=false;
const save=()=>store.set(KEY,S);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const course=()=>COURSES.find(c=>c.id===S.courseId);
const holeInfo=i=>{const [par,hcp,rot]=course().holes[i];return{par,hcp,loc:LOC[rot[S.pin-1]]}};
const sum=(a,from=0,to=18)=>a.slice(from,to).reduce((t,v)=>t+(v??0),0);
const played=(p,from=0,to=18)=>p.scores.slice(from,to).filter(v=>v!==null).length;
const fmt=n=>(Math.round(n*10)/10).toFixed(Number.isInteger(Math.round(n*10)/10)?0:1);
const signed=n=>(n>0?"+":n<0?"−":"±")+fmt(Math.abs(n));
const cls=n=>n>0?"up":n<0?"down":"";
const pc=i=>`var(${COLORS[i]})`;
const tF=p=>p.target/2, tB=p=>p.target/2, tT=p=>p.target;
const tSeg=(p,from,to)=>to-from===18?tT(p):from===0?tF(p):tB(p);
const holeDone=i=>S.players.every(p=>p.scores[i]!==null);

/* ---------- SETUP ---------- */
function renderSetup(){
  const roster=(store.get(RKEY)||[]).filter(r=>!S.players.some(p=>p.name.trim().toLowerCase()===r.name.toLowerCase()));
  const c=course();
  $("#app").innerHTML=`
  ${brand(false)}
  <section class="panel">
    <span class="label">Course</span>
    <div class="seg course-seg">${COURSES.map(x=>`<button data-course="${x.id}" aria-pressed="${x.id===S.courseId}">${x.name}<small>Par ${x.holes.reduce((t,h)=>t+h[0],0)}</small></button>`).join("")}</div>
  </section>
  <section class="panel">
    <span class="label">Hole location</span>
    <div class="seg">${[[1,"Front"],[2,"Middle"],[3,"Back"]].map(([n,l])=>`<button data-pin="${n}" aria-pressed="${n===S.pin}">${n}<small>${l}</small></button>`).join("")}</div>
  </section>
  <section class="panel">
    <div class="row"><span class="label grow">Players (${S.players.length}/5)</span><span class="label">Quota</span></div>
    ${S.players.map((p,i)=>`<div class="prow"><span class="swatch" style="background:${pc(i)}"></span>
      <input id="pn${i}" data-pn="${i}" placeholder="Player name" value="${esc(p.name)}" autocomplete="off">
      <input id="pt${i}" data-pt="${i}" type="number" inputmode="numeric" min="0" max="90" placeholder="pts" value="${esc(p.target)}" class="num">
      <button class="xbtn" data-rm="${i}" aria-label="Remove ${esc(p.name||"player")}">✕</button></div>`).join("")}
    ${S.players.length<5?`<div class="finder">
      <input id="q" type="search" placeholder="Find a player on the Golf Bunch list" value="${esc(q)}" autocomplete="off">
      ${q.trim()?`<div class="results">${TARGETS.list.filter(([n])=>n.toLowerCase().includes(q.trim().toLowerCase())&&!S.players.some(p=>p.name.toLowerCase()===n.toLowerCase())).slice(0,8).map(([n,t])=>`<button data-pick="${esc(n)}" data-pt2="${t??""}"><span>${esc(n)}</span><b class="num">${t??"qualifying"}</b></button>`).join("")||`<span class="hint">No one on the list matches “${esc(q)}”. Add them below.</span>`}</div>`:""}
      </div>
      <button class="btn" id="add">Add player not on the list</button>`:""}
    <div class="row"><span class="hint grow">Targets from the Golf Bunch list · ${TARGETS.source==="live"?"updated "+esc(TARGETS.date):"as of "+esc(TARGETS.date)}</span>
      <button class="btn small" id="refill">Refresh targets</button></div>
    ${roster.length&&S.players.length<5?`<div class="label">Recent players</div><div class="roster">${roster.map(r=>`<button data-roster="${esc(r.name)}" data-rt="${r.target}">${esc(r.name)} · ${r.target}</button>`).join("")}</div>`:""}
    <span class="hint">Target is for 18 holes. Front and back are each half.</span>
  </section>
  ${setupErr?`<div class="err" role="alert">${esc(setupErr)}</div>`:""}
  <button class="btn primary" id="start">Tee off</button>`;
}
function startRound(){
  S.players=S.players.filter(p=>p.name.trim()||p.target!=="");
  if(!S.players.length){setupErr="Add at least one player.";S.players=[blank()];return render()}
  for(const p of S.players){
    if(!p.name.trim()){setupErr="Every player needs a name.";return render()}
    const t=Number(p.target);
    if(p.target===""||isNaN(t)||t<0){setupErr=`Enter a quota for ${p.name}.`;return render()}
    p.target=t; p.name=p.name.trim();
  }
  const roster=store.get(RKEY)||[];
  S.players.forEach(p=>{const i=roster.findIndex(r=>r.name.toLowerCase()===p.name.toLowerCase());if(i>=0)roster.splice(i,1);roster.unshift({name:p.name,target:p.target})});
  store.set(RKEY,roster.slice(0,12));
  setupErr="";S.view="play";S.tab="hole";S.hole=0;S.turnSeen=false;save();render();
}
const blank=()=>({name:"",target:"",scores:Array(18).fill(null)});

    <div class="pts">${PTS.map(([v,l])=>`<button data-gset="${v}" aria-pressed="${gp.scores[gsel.k]===+v}"><b>${v}</b><small>${l}</small></button>`).join("")}</div>
    <div class="row"><button class="btn small grow" data-gset="x">Clear</button>
      <button class="btn small grow" id="gdir">Then go: ${gdir==="hole"?"next hole ▶":"next player ▼"}</button></div>
    <span class="hint">On a keyboard, type 0–5 to fill and arrow keys to move.</span>

}
let gsel={pi:0,k:0}, gdir="hole";
function gmove(step){
  const n=S.players.length;
  if(gdir==="hole"){let k=gsel.k+step,pi=gsel.pi;if(k>17){k=0;pi=(pi+1)%n}if(k<0){k=17;pi=(pi-1+n)%n}gsel={pi,k}}
  else{let pi=gsel.pi+step,k=gsel.k;if(pi>=n){pi=0;k=Math.min(17,k+1)}if(pi<0){pi=n-1;k=Math.max(0,k-1)}gsel={pi,k}}
}
function gset(v){S.players[gsel.pi].scores[gsel.k]=v==="x"?null:+v;if(v!=="x")gmove(1);save();render()}
function setScore(pi,hole,v){S.players[pi].scores[hole]=S.players[pi].scores[hole]===v&&S.tab==="hole"?null:v;save();render()}
function next(){
  const i=S.hole;
  if(!holeDone(i)){const miss=S.players.filter(p=>p.scores[i]===null).map(p=>p.name);return toast(`Enter points for ${miss.join(", ")}`)}
  if(i===8&&!S.turnSeen){S.turnSeen=true;S.hole=9;S.view="turn";save();return render()}
  if(i===17){const first=[...Array(18).keys()].find(k=>!holeDone(k));if(first!==undefined){S.hole=first;save();render();return toast(`Hole ${first+1} still needs scores`)}S.view="final";save();return render()}
  S.hole=i+1;save();render();scrollTo({top:0});
}

/* ---------- SUMMARIES ---------- */

  return `<div class="lb">${rows.map((r,k)=>`<div class="lbrow num"><span class="rank">${k+1}</span><span class="pname"><i style="background:${pc(r.pi)}"></i><span>${esc(r.p.name)}</span></span><span class="score">${r.s}</span><span class="tgt">quota ${fmt(r.t)}<br><span class="delta ${cls(r.d)}">${signed(r.d)}</span></span></div>`).join("")}</div>`;
}
function teamLine(from,to,div){const s=S.players.reduce((t,p)=>t+sum(p.scores,from,to),0),t=S.players.reduce((a,p)=>a+tSeg(p,from,to),0),d=s-t;return{s,t,d}}

  return lines.join("\n").replace(/−/g,"-").replace(/±/g,"+");

let toastT;function toast(m){clearTimeout(toastT);let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;toastT=setTimeout(()=>t.remove(),2200)}
let wake=null;async function keepAwake(){try{wake=await navigator.wakeLock.request("screen");toast("Screen will stay on")}catch(e){toast("This device won't allow keeping the screen on")}}

/* ---------- EVENTS ---------- */
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.pn!==undefined){S.players[+t.dataset.pn].name=t.value;save()}
  if(t.dataset.pt!==undefined){S.players[+t.dataset.pt].target=t.value;save()}
  if(t.dataset.et!==undefined){const k=t.dataset.et,v=+t.value||0;$(`#ef${k}`).textContent=fmt(v/2);$(`#eb${k}`).textContent=fmt(v/2)}
  if(t.id==="q"){q=t.value;const pos=t.selectionStart;render();const n=$("#q");if(n){n.focus();n.setSelectionRange(pos,pos)}}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.pn!==undefined){const p=S.players[+t.dataset.pn],m=findTarget(p.name);if(m&&m[1]!==null&&p.target===""){p.target=String(m[1]);save();render()}}});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button")||e.target; const d=b.dataset||{};
  if(b.id==="scrim"){return closeSheet()}
  if(d.course){S.courseId=d.course;save();return render()}
  if(d.pin){S.pin=+d.pin;save();return render()}
  if(d.rm!==undefined){S.players.splice(+d.rm,1);if(!S.players.length)S.players.push(blank());save();return render()}
  if(b.id==="add"){S.players.push(blank());save();render();return $(`#pn${S.players.length-1}`).focus()}
  if(d.roster){const empty=S.players.findIndex(p=>!p.name.trim()&&p.target==="");const np={...blank(),name:d.roster,target:d.rt};empty>=0?S.players[empty]=np:S.players.push(np);save();return render()}
  if(d.pick){const empty=S.players.findIndex(p=>!p.name.trim()&&p.target==="");const np={...blank(),name:d.pick,target:d.pt2};empty>=0?S.players[empty]=np:S.players.push(np);q="";save();render();const n=$("#q");if(n)n.focus();if(d.pt2==="")toast(`${d.pick} is still qualifying. Enter a target.`);return}
  if(b.id==="refill"){b.textContent="Checking…";await loadTargets();let n=0;S.players.forEach(p=>{const m=findTarget(p.name);if(m&&m[1]!==null&&String(p.target)!==String(m[1])){p.target=String(m[1]);n++}});save();render();return toast(n?`Updated ${n} target${n>1?"s":""}`:"Targets are up to date")}
  if(b.id==="start")return startRound();
  if(d.score){const[pi,v]=d.score.split(":").map(Number);return setScore(pi,S.hole,v)}
  if(d.step){S.hole=Math.min(17,Math.max(0,S.hole+ +d.step));save();return render()}
  if(d.tab){S.tab=d.tab;save();return render()}
  if(d.cell){const[pi,k]=d.cell.split(":").map(Number);gsel={pi,k};return render()}
  if(d.gset)return gset(d.gset);
  if(d.gmove){gmove(+d.gmove);return render()}
  if(b.id==="gdir"){gdir=gdir==="hole"?"player":"hole";return render()}
  if(d.set){const[pi,k,v]=d.set.split(":");S.players[+pi].scores[+k]=v==="x"?null:+v;save();closeSheet();return render()}
  if(d.pchip!==undefined)return playerSheet(+d.pchip,S.hole);
  if(d.psel){const[pi,k]=d.psel.split(":").map(Number);return playerSheet(pi,k)}
  if(d.pset){const[pi,v]=d.pset.split(":");S.players[+pi].scores[psel]=v==="x"?null:+v;save();render();return playerSheet(+pi,v==="x"?psel:Math.min(17,psel+1))}
  if(b.id==="prev"){S.hole=Math.max(0,S.hole-1);save();return render()}
  if(b.id==="next")return next();
  if(b.id==="toBack"){S.view="play";S.tab="hole";save();render();return scrollTo({top:0})}
  if(b.id==="edit"){S.view="play";S.tab="card";save();return render()}
  if(b.id==="newround"){S.players.forEach(p=>p.scores=Array(18).fill(null));S.view="setup";S.hole=0;S.turnSeen=false;save();return render()}
  if(b.id==="copy"){const txt=resultsText();try{await navigator.clipboard.writeText(txt);toast("Results copied")}catch(err){sheet(`<h2>Results</h2><textarea id="rt" rows="8" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">${esc(txt)}</textarea><button class="btn" id="close">Done</button>`);$("#rt").select()}return}
  if(b.id==="menu")return menuSheet();
  if(b.id==="close")return closeSheet();
  if(b.id==="m-back"){S.view="play";save();closeSheet();return render()}
  if(b.id==="m-scores"){S.view="play";S.tab="card";save();closeSheet();return render()}
  if(b.id==="m-targets")return sheet(`<h2>Edit targets</h2><span class="hint">Fix a player's 18-hole target. Front and back are each half.</span>
    <div class="etgrid num"><span></span><span class="label">18</span><span class="label">Front</span><span class="label">Back</span>
    ${S.players.map((p,pi)=>`<label for="et${pi}" style="font-weight:700;color:${pc(pi)}">${esc(p.name)}</label>
      <input id="et${pi}" data-et="${pi}" type="number" inputmode="decimal" min="0" value="${p.target}">
      <b id="ef${pi}">${fmt(tF(p))}</b><b id="eb${pi}">${fmt(tB(p))}</b>`).join("")}</div>
    <span class="err" id="eterr"></span>
    <div class="row"><button class="btn grow" id="close">Cancel</button><button class="btn primary grow" id="et-save">Save targets</button></div>`);
  if(b.id==="et-save"){const vals=S.players.map((p,pi)=>$(`#et${pi}`).value);
    if(vals.some(v=>v===""||isNaN(+v)||+v<0)){$("#eterr").textContent="Every player needs a target of 0 or more.";return}
    vals.forEach((v,k)=>S.players[k].target=+v);save();closeSheet();render();return toast("Targets saved")}
  if(b.id==="m-turn"){S.view="turn";save();closeSheet();return render()}
  if(b.id==="m-wake"){closeSheet();return keepAwake()}
  if(b.id==="m-theme"){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";store.set("windyke-theme",r.dataset.theme);return closeSheet()}
  if(b.id==="m-reset"){if(!confirmReset){confirmReset=true;return menuSheet()}const keep=S.players.map(p=>({name:p.name,target:String(p.target),scores:Array(18).fill(null)}));S=fresh();S.players=keep;save();closeSheet();return render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();
  if(S.view==="play"&&S.tab==="card"&&!$("#layer").innerHTML&&e.target.tagName!=="INPUT"){
    if(/^[0-5]$/.test(e.key))return gset(e.key);
    if(e.key==="Backspace"||e.key==="Delete")return gset("x");
    const mv={ArrowRight:["hole",1],ArrowLeft:["hole",-1],ArrowDown:["player",1],ArrowUp:["player",-1]}[e.key];
    if(mv){e.preventDefault();const keep=gdir;gdir=mv[0];gmove(mv[1]);gdir=keep;return render()}
  }if(e.key==="Enter"&&S.view==="setup"&&e.target.tagName==="INPUT")startRound()});

function render(){
  const sl=[...document.querySelectorAll(".gridwrap")].map(g=>g.scrollLeft);
  draw();
  document.querySelectorAll(".gridwrap").forEach((g,i)=>{if(sl[i])g.scrollLeft=sl[i]});
}
function draw(){
  if(S.view!=="setup"&&!course())S=fresh();
  if(S.view==="setup"){renderSetup();$("#nav").innerHTML=""}
  else if(S.view==="turn")renderTurn();
  else if(S.view==="final")renderFinal();
  else renderPlay();
}
const nav=document.createElement("nav");nav.className="nav";nav.id="nav";document.body.appendChild(nav);
const th=store.get("windyke-theme");if(th)document.documentElement.dataset.theme=th;
render();
loadTargets();
</script>

</body>
</html>
